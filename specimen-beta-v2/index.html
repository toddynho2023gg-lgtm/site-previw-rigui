<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071013">
<title>Containment Beta V2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071013;color:#eef;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{touch-action:none;user-select:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;z-index:5;text-shadow:0 2px 10px #000}#obj{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));background:#020708a8;border:1px solid #ffffff24;padding:9px 11px;border-radius:10px;font-size:13px;backdrop-filter:blur(7px);max-width:55vw}#dot{position:absolute;left:50%;top:50%;width:6px;height:6px;border:1px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px #ffffff66}#msg{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);background:#000a;padding:8px 12px;border:1px solid #ffffff1d;border-radius:8px;font-size:12px;min-width:150px;text-align:center;opacity:0;transition:opacity .12s}#msg.on{opacity:1}
#mapWrap{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:108px;height:108px;border-radius:15px;overflow:hidden;background:#02070880;border:1px solid #ffffff20;box-shadow:0 10px 26px #0005;backdrop-filter:blur(8px);opacity:.82}#mini{width:100%;height:100%}
#vignette{position:fixed;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 110px 18px rgba(0,0,0,.48)}#danger{position:fixed;inset:0;z-index:4;pointer-events:none}.screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#1b292b7a,#020607 72%);padding:20px}.card{max-width:560px;border:1px solid #ffffff25;background:#05090ae8;padding:24px;border-radius:14px;box-shadow:0 26px 80px #0008}small{letter-spacing:.14em;color:#93a4a7}h1{margin:6px 0;font-size:42px}p{color:#b9c4c6;line-height:1.5}button{border:1px solid #caffdd42;border-radius:9px;background:#dfffe9;color:#07100b;font-weight:800;padding:13px 16px}.hidden{display:none!important}#mobile{display:none;position:fixed;inset:0;z-index:10;pointer-events:none}#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;border:1px solid #ffffff33;background:#0004;pointer-events:auto}#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:#ffffff1c;border:1px solid #ffffff40;transform:translate(-50%,-50%)}.m{position:absolute;width:66px;height:66px;border-radius:50%;background:#080b0cba;color:#fff;border:1px solid #ffffff33;pointer-events:auto;padding:0;font-size:11px;backdrop-filter:blur(5px)}#use{right:max(20px,env(safe-area-inset-right));bottom:max(30px,env(safe-area-inset-bottom))}#light{right:92px;bottom:98px}#run{right:max(20px,env(safe-area-inset-right));bottom:112px}@media(pointer:coarse),(max-width:800px){#mobile{display:block}.card{padding:20px}h1{font-size:34px}#mapWrap{width:90px;height:90px;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));border-radius:13px}#obj{font-size:12px;max-width:calc(100vw - 122px)}}
</style>
</head>
<body>
<div id="hud"><div id="obj">Objetivo: encontre o cartão azul.</div><div id="mapWrap"><canvas id="mini" width="180" height="180"></canvas></div><div id="dot"></div><div id="msg"></div></div><div id="vignette"></div><div id="danger"></div>
<div id="mobile"><div id="stick"><div id="knob"></div></div><button class="m" id="use">USAR</button><button class="m" id="light">LUZ</button><button class="m" id="run">CORRER</button></div>
<div id="start" class="screen"><div class="card"><small>THREE.JS · SURVIVAL HORROR BETA V2</small><h1>CONTAINMENT</h1><p>Encontre o cartão azul e escape da instalação antes que a criatura alcance você.</p><p><b>Celular:</b> analógico esquerdo para andar, arraste o lado direito para olhar. Use LUZ, CORRER e USAR.</p><button id="go">ENTRAR NA INSTALAÇÃO</button></div></div>
<div id="end" class="screen hidden"><div class="card"><h1 id="endTitle"></h1><p id="endText"></p><button onclick="location.reload()">JOGAR DE NOVO</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';
const coarse=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>0;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x071013);scene.fog=new THREE.FogExp2(0x0b171a,.034);
const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,80);cam.rotation.order='YXZ';scene.add(cam);
const r=new THREE.WebGLRenderer({antialias:!coarse,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,coarse?1.25:1.7));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.18;document.body.prepend(r.domElement);
scene.add(new THREE.HemisphereLight(0xaac7cd,0x151a1b,.42));scene.add(new THREE.AmbientLight(0x91a9ad,.15));
const flash=new THREE.SpotLight(0xf5fff9,12.5,25,Math.PI/5.2,.42,1.15);flash.position.set(0,-.03,0);flash.target.position.set(0,-.03,-1);flash.castShadow=true;flash.shadow.mapSize.set(512,512);cam.add(flash,flash.target);
const G=['#############','#S....#.....E#','#.##..#.###..#','#.....#...#..#','###.#####.#..#','#...#.....#..#','#.#.#.###.#..#','#.#...#...#..#','#.#####.###..#','#.....K......#','#.#########..#','#M...........#','#############'];
const H=G.length,W=G[0].length,T=2.6,cx=(W-1)/2,cz=(H-1)/2;const wp=(x,z)=>new THREE.Vector3((x-cx)*T,0,(z-cz)*T);let mark={};for(let z=0;z<H;z++)for(let x=0;x<W;x++)if('SKME'.includes(G[z][x]))mark[G[z][x]]={x,z};
const matF=new THREE.MeshStandardMaterial({color:0x222b2c,roughness:.92}),matW=new THREE.MeshStandardMaterial({color:0x354042,roughness:.84,metalness:.16});const floor=new THREE.Mesh(new THREE.PlaneGeometry(W*T,H*T),matF);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W*T,H*T),new THREE.MeshStandardMaterial({color:0x141b1c,roughness:1}));ceil.rotation.x=Math.PI/2;ceil.position.y=3.1;scene.add(ceil);const wg=new THREE.BoxGeometry(T,3.1,T);for(let z=0;z<H;z++)for(let x=0;x<W;x++)if(G[z][x]=='#'){const m=new THREE.Mesh(wg,matW);const p=wp(x,z);m.position.set(p.x,1.55,p.z);m.castShadow=m.receiveShadow=true;scene.add(m)}
for(const [i,[x,z]] of [[0,[1,1]],[1,[4,3]],[2,[9,3]],[3,[11,8]],[4,[5,9]],[5,[2,7]],[6,[10,10]]]){const p=wp(x,z),l=new THREE.PointLight(i%3===0?0xbadfd9:0x8cb5b8,.9,7.5,2);l.position.set(p.x,2.75,p.z);scene.add(l);const fixture=new THREE.Mesh(new THREE.BoxGeometry(.7,.05,.2),new THREE.MeshStandardMaterial({color:0x30393a,emissive:i%3===0?0x24413d:0x1b2d30,emissiveIntensity:.7}));fixture.position.set(p.x,3.02,p.z);scene.add(fixture)}
const key=new THREE.Group();const kc=new THREE.Mesh(new THREE.BoxGeometry(.5,.12,.7),new THREE.MeshStandardMaterial({color:0x32c8ff,emissive:0x32c8ff,emissiveIntensity:1.8}));key.add(kc,new THREE.PointLight(0x32c8ff,2.5,4.5));let kp=wp(mark.K.x,mark.K.z);key.position.set(kp.x,.45,kp.z);scene.add(key);
const door=new THREE.Mesh(new THREE.BoxGeometry(1.7,2.6,.2),new THREE.MeshStandardMaterial({color:0x253032,metalness:.55,roughness:.5}));let ep=wp(mark.E.x,mark.E.z);door.position.set(ep.x,1.3,ep.z);scene.add(door);const doorLamp=new THREE.PointLight(0xff6655,.7,2.5);doorLamp.position.set(ep.x,2.1,ep.z-.25);scene.add(doorLamp);
const monster=new THREE.Group();const monMat=new THREE.MeshStandardMaterial({color:0x171717,roughness:1});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.36,1.25,4,8),monMat);body.position.y=1;const head=new THREE.Mesh(new THREE.SphereGeometry(.39,16,12),monMat);head.position.y=1.9;monster.add(body,head);for(const x of [-.14,.14]){const e=new THREE.Mesh(new THREE.SphereGeometry(.045,8,6),new THREE.MeshBasicMaterial({color:0xffdddd}));e.position.set(x,1.95,-.36);monster.add(e)}let mp=wp(mark.M.x,mark.M.z);monster.position.copy(mp);scene.add(monster);
const st={started:false,key:false,alive:true,won:false,light:true};let yaw=0,pitch=0,keys=new Set(),runTouch=false,interact=false,flashQ=false;const sp=wp(mark.S.x,mark.S.z);cam.position.set(sp.x,1.65,sp.z);
function cell(x,z){return{x:Math.floor(x/T+cx+.5),z:Math.floor(z/T+cz+.5)}}function open(x,z){const c=cell(x,z);return c.x>=0&&c.z>=0&&c.x<W&&c.z<H&&G[c.z][c.x]!='#'}function move(dx,dz){let nx=cam.position.x+dx,nz=cam.position.z+dz;if(open(nx,cam.position.z))cam.position.x=nx;if(open(cam.position.x,nz))cam.position.z=nz}
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyE')interact=true;if(e.code==='KeyF')flashQ=true});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('mousemove',e=>{if(document.pointerLockElement===r.domElement){yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.35,Math.min(1.35,pitch))}});r.domElement.addEventListener('click',()=>{if(st.started&&!coarse)r.domElement.requestPointerLock()});
const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');let sv={x:0,y:0};function stickAt(e){let q=e.touches?e.touches[0]:e,b=stick.getBoundingClientRect(),x=q.clientX-(b.left+b.width/2),y=q.clientY-(b.top+b.height/2),m=Math.hypot(x,y),mx=42;if(m>mx){x=x/m*mx;y=y/m*mx}sv.x=x/mx;sv.y=y/mx;knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`}stick.addEventListener('touchstart',stickAt,{passive:false});stick.addEventListener('touchmove',e=>{e.preventDefault();stickAt(e)},{passive:false});stick.addEventListener('touchend',()=>{sv.x=sv.y=0;knob.style.transform='translate(-50%,-50%)'});
let lt=null;r.domElement.addEventListener('touchstart',e=>{for(const t of e.changedTouches)if(t.clientX>innerWidth*.38)lt={id:t.identifier,x:t.clientX,y:t.clientY}},{passive:false});r.domElement.addEventListener('touchmove',e=>{if(!lt)return;for(const t of e.changedTouches)if(t.identifier===lt.id){let dx=t.clientX-lt.x,dy=t.clientY-lt.y;yaw-=dx*.004;pitch-=dy*.004;pitch=Math.max(-1.35,Math.min(1.35,pitch));lt.x=t.clientX;lt.y=t.clientY}},{passive:false});r.domElement.addEventListener('touchend',()=>lt=null);
document.querySelector('#use').ontouchstart=e=>{e.preventDefault();interact=true};document.querySelector('#light').ontouchstart=e=>{e.preventDefault();flashQ=true};document.querySelector('#run').ontouchstart=e=>{e.preventDefault();runTouch=true};document.querySelector('#run').ontouchend=()=>runTouch=false;
const obj=document.querySelector('#obj'),msg=document.querySelector('#msg'),danger=document.querySelector('#danger'),mini=document.querySelector('#mini'),ctx=mini.getContext('2d');
function finish(win){st.alive=false;st.won=win;document.querySelector('#end').classList.remove('hidden');document.querySelector('#endTitle').textContent=win?'VOCÊ ESCAPOU.':'VOCÊ FOI ENCONTRADO';document.querySelector('#endText').textContent=win?'Loop básico concluído: exploração, item, perseguição e saída.':'A criatura alcançou você.'}
function nearest(){const dk=cam.position.distanceTo(key.position),de=Math.hypot(cam.position.x-ep.x,cam.position.z-ep.z);if(!st.key&&dk<1.5)return'key';if(de<1.7)return'exit';return null}
function use(){const n=nearest();if(n==='key'){st.key=true;key.visible=false;obj.textContent='Objetivo: vá até a porta de saída.';doorLamp.color.set(0x44ff88);doorLamp.intensity=1.1}else if(n==='exit'){if(st.key)finish(true);else{msg.textContent='A porta exige o cartão azul.';msg.classList.add('on');setTimeout(()=>msg.classList.remove('on'),900)}}}
function monsterStep(dt){if(!st.key)return;const dx=cam.position.x-monster.position.x,dz=cam.position.z-monster.position.z,d=Math.hypot(dx,dz),s=2.0;monster.position.x+=dx/Math.max(d,.01)*s*dt;monster.position.z+=dz/Math.max(d,.01)*s*dt;monster.lookAt(cam.position.x,1,cam.position.z);const v=Math.max(0,1-d/9);danger.style.background=`radial-gradient(circle,transparent 36%,rgba(130,0,0,${v*.46}))`;if(d<.8)finish(false)}
function drawMini(){const w=mini.width,h=mini.height,p=12,cs=Math.min((w-p*2)/W,(h-p*2)/H),ox=(w-W*cs)/2,oy=(h-H*cs)/2;ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(3,9,10,.76)';ctx.fillRect(0,0,w,h);for(let z=0;z<H;z++)for(let x=0;x<W;x++){ctx.fillStyle=G[z][x]==='#'?'rgba(180,205,208,.20)':'rgba(255,255,255,.035)';ctx.fillRect(ox+x*cs,oy+z*cs,Math.max(1,cs-1),Math.max(1,cs-1))}if(!st.key){ctx.fillStyle='#39ccff';ctx.fillRect(ox+mark.K.x*cs+cs*.2,oy+mark.K.z*cs+cs*.2,cs*.6,cs*.6)}ctx.fillStyle=st.key?'#57ff92':'#718286';ctx.fillRect(ox+mark.E.x*cs+cs*.18,oy+mark.E.z*cs+cs*.18,cs*.64,cs*.64);const pc=cell(cam.position.x,cam.position.z),px=ox+(pc.x+.5)*cs,py=oy+(pc.z+.5)*cs;ctx.save();ctx.translate(px,py);ctx.rotate(yaw);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-cs*.42);ctx.lineTo(cs*.27,cs*.3);ctx.lineTo(-cs*.27,cs*.3);ctx.closePath();ctx.fill();ctx.restore();if(st.key){const md=Math.hypot(cam.position.x-monster.position.x,cam.position.z-monster.position.z);if(md<8.5){const mc=cell(monster.position.x,monster.position.z);ctx.fillStyle=`rgba(255,75,75,${.55+(1-md/8.5)*.4})`;ctx.beginPath();ctx.arc(ox+(mc.x+.5)*cs,oy+(mc.z+.5)*cs,Math.max(2.6,cs*.24),0,Math.PI*2);ctx.fill()}}}
document.querySelector('#go').onclick=()=>{st.started=true;document.querySelector('#start').classList.add('hidden');if(!coarse)r.domElement.requestPointerLock()};
let prev=performance.now();function loop(now){let dt=Math.min((now-prev)/1000,.04);prev=now;if(st.started&&st.alive&&!st.won){cam.rotation.y=yaw;cam.rotation.x=pitch;let f=(keys.has('KeyW')?1:0)-(keys.has('KeyS')?1:0)-sv.y,s=(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0)+sv.x,l=Math.hypot(f,s);if(l>1){f/=l;s/=l}let sn=Math.sin(yaw),cs=Math.cos(yaw),dx=s*cs+f*sn,dz=s*sn-f*cs,spd=(keys.has('ShiftLeft')||runTouch)?5:3;move(dx*spd*dt,dz*spd*dt);if(flashQ){st.light=!st.light;flash.visible=st.light;flashQ=false}if(interact){use();interact=false}const n=nearest();if(n){msg.textContent=n==='key'?'USAR · pegar cartão':(st.key?'USAR · abrir saída':'Porta bloqueada');msg.classList.add('on')}else msg.classList.remove('on');key.rotation.y+=dt*1.4;key.position.y=.45+Math.sin(now*.0024)*.045;monsterStep(dt)}drawMini();r.render(scene,cam);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,coarse?1.25:1.7))});
</script>
</body>
